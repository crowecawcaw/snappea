# cargo-fuzz targets (nightly). Each one calls a harness in crates/snappea-fuzz.
# See docs/fuzzing.md.
[package]
name = "snappea-fuzz-targets"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
snappea-fuzz = { path = "../crates/snappea-fuzz" }

# Not part of the main workspace: it needs nightly and libFuzzer.
[workspace]
members = ["."]

[profile.release]
debug = 1
# Find integer overflow and debug assertions, which release builds hide.
overflow-checks = true
debug-assertions = true

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compile"
path = "fuzz_targets/compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "observe"
path = "fuzz_targets/observe.rs"
test = false
doc = false
bench = false
