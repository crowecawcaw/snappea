[package]
name = "snappea"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The P modeling language in Rust: emit events from your application and check them against P specs in tests, plus the `snappea` checker"
documentation = "https://docs.rs/snappea"
readme = "README.md"
keywords = ["p-language", "model-checking", "formal-methods", "testing", "specification"]
categories = ["development-tools::testing", "command-line-utilities"]
include = ["Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**/*.rs", "src/**/README.md", "src/cli/guide/**/*"]

[lib]
name = "snappea"

[features]
default = ["bin", "test"]
# `snappea::emit`: emit application events (tests, SNAPPEA_EVENTS_DIR, production logs). No
# checker; depends only on serde and serde_json. Production code uses only this.
emit = ["dep:serde", "dep:serde_json"]
# `snappea::test`: check recorded events against P specs, in process. Also enables the
# checker library.
test = ["checker", "emit", "dep:regex"]
# The `snappea` and `snappea-compat` binaries.
bin = ["cli", "dep:mimalloc"]
# `snappea::cli` and `snappea::compat`: run the CLIs in process (the playground, fuzzing).
cli = ["checker"]
# Internal: the checker library (`snappea::syntax`, `snappea::sema`, `snappea::checker`,
# `snappea::host`, `snappea::project`, `snappea::driver`), which `test` and `cli` both need.
# JSON objects keep their key order, so payloads read and reports print alike in both.
checker = ["dep:snappea-syntax", "dep:snappea-lint", "dep:roxmltree", "dep:rustc-hash", "dep:serde_json", "serde_json/preserve_order", "dep:sha2"]

[[bin]]
name = "snappea"
path = "src/bin/snappea.rs"
required-features = ["bin"]

[[bin]]
name = "snappea-compat"
path = "src/bin/snappea-compat.rs"
required-features = ["bin"]

[dependencies]
snappea-syntax = { workspace = true, optional = true }
snappea-lint = { workspace = true, optional = true }
regex = { version = "1", default-features = false, features = ["std", "unicode"], optional = true }
roxmltree = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true }

# The binaries allocate with mimalloc: the checker allocates and frees many small values
# per schedule, and mimalloc's per-thread free lists reuse that memory quickly.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
