# Checks the example P model the way a project using snappea would, with this checkout's
# build of snappea: the model can use lint rules and features not yet released.
# examples/model/github-workflow.yml is the copyable version, which installs the released
# CLI; keep the two in step. See
# https://crowecawcaw.github.io/snappea/docs/github-actions.html

name: Check the P model

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/model
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-model
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Where examples/model/github-workflow.yml installs the released CLI.
      - name: Build snappea from this checkout
        working-directory: .
        run: |
          cargo build -p snappea --bin snappea --locked
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Type-check and list the test cases
        run: snappea tests

      # Exit status 1 (a bug or missing required coverage) or 2 (an error) fails the job.
      - name: Check the model
        run: snappea check tcAtomicReserve

      # The failing schedule, its log and a replay file, to download from the run page.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: snappea-output
          path: examples/model/PCheckerOutput
