# Build, lint and test on every PR and on every push to main.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint all workflows (including embedded shell)
        run: |
          # ShellCheck is preinstalled on ubuntu-latest. Require it so actionlint
          # cannot silently skip shell syntax checks for jobs gated on PR close.
          shellcheck --version
          "${RUNNER_TEMP}/actionlint" -color

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          # PR runs read the cache; only main writes it, so PRs don't evict each other.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Clippy, each snappea feature alone
        run: |
          for feature in emit test cli; do
            cargo clippy -p snappea --no-default-features --features "$feature" --locked
          done

  test:
    name: build + test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        # the upstream comparisons run in their own job, below
        run: cargo test --workspace --locked -- --skip matches_upstream_
      - name: Build snappea for production use (emit only, no checker)
        run: |
          cargo build -p snappea --no-default-features --features emit --locked
          deps=$(cargo tree -p snappea --no-default-features --features emit -e normal --prefix none)
          if echo "$deps" | grep -E '^(regex|roxmltree|rustc-hash|sha2) '; then
            echo "::error::snappea with only the emit feature pulls in checker dependencies" >&2
            exit 1
          fi
      - name: Check the published crate package
        run: cargo package -p snappea-syntax -p snappea-lint -p snappea --locked

  checker-discovery:
    name: auto finds all benchmark bugs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: checker-discovery
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test benchmark metrics and CI gates
        run: python3 -m unittest discover -s scripts -p test_bench_checker.py
      - name: Build the checker benchmark
        run: cargo build --release --locked -p snappea --example checker_bench
      - name: Find every development bug with auto
        run: |
          python3 scripts/bench-checker.py --binary target/release/examples/checker_bench \
            --strategies auto --split develop --seeds 10 --seed-start 0 \
            --budget 25000 --check --out benchmark-results/develop.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Find every evaluation bug with auto
        run: |
          python3 scripts/bench-checker.py --binary target/release/examples/checker_bench \
            --strategies auto --split evaluation --seeds 10 --seed-start 100 \
            --budget 25000 --check --out benchmark-results/evaluation.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checker-discovery
          path: benchmark-results/

  upstream-compat:
    name: upstream compat
    # snappea-compat against the frozen outputs of upstream P in tests/upstream/goldens and
    # tests/upstream/PObserve (docs/compatibility.md, "How compatibility is checked").
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: false
      - name: Compare with upstream P
        run: cargo test -p snappea --locked --test compat_check_upstream --test compat_observe_upstream

  web:
    name: web playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build (wasm + typecheck + bundle)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Smoke-test the wasm module in Node
        run: node crates/snappea-wasm/js/smoke.mjs target/wasm32-unknown-unknown/wasm/snappea_wasm.wasm
