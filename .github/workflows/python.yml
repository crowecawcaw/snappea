# The Python package (python/): tests on PRs and main; wheels with the snappea binary for
# five platforms when release.yml calls this workflow (release.yml uploads them to PyPI).

name: Python

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build wheels for (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: python-${{ github.event.pull_request.number || inputs.tag || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    if: ${{ !inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install the package (builds the binary)
        run: pip install ./python './examples/python[test]' pytest-xdist  # xdist: the coverage lock test
      - name: Test
        working-directory: python
        run: python -m pytest -p no:cacheprovider

      - name: Guide examples (`snappea guide example ...`)
        if: matrix.python == '3.13'
        run: python scripts/check-guide-examples.py

      - name: Inventory example (explicit checks)
        working-directory: examples/python/explicit
        run: python -m pytest -p no:cacheprovider
      - name: Inventory example (automatic pytest checks)
        working-directory: examples/python/pytest
        run: python -m pytest -p no:cacheprovider
      - name: Inventory example (Hypothesis stateful tests)
        working-directory: examples/python/hypothesis
        run: python -m pytest -p no:cacheprovider

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-model-${{ matrix.os }}-${{ matrix.python }}
          path: examples/python/pytest/coverage/monitor.json
          if-no-files-found: warn

  wheels:
    name: wheel (${{ matrix.target }})
    if: ${{ inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_17" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, manylinux: "2_17" }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Check the version matches the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # wheels take their version from crates/snappea, i.e. the workspace version
          grep -qx "version = \"${TAG#v}\"" Cargo.toml || { echo "::error::Cargo.toml's version is not ${TAG#v}" >&2; exit 1; }
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          working-directory: python
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: python/dist

  sdist:
    name: sdist
    if: ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: python/dist
