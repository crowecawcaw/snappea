name: Search effectiveness
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: search-bench
      - name: Measure schedules to all known bugs
        run: python3 scripts/bench-search.py --out search.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Measure every example and regression model case
        run: |
          python3 scripts/bench-corpus.py --out corpus.json --report corpus.md
          cat corpus.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record every main commit
        if: github.ref == 'refs/heads/main'
        run: .github/scripts/push-bench-data.sh append search.json search.jsonl "Search effectiveness ${GITHUB_SHA::7}"
      - name: Record corpus results
        if: github.ref == 'refs/heads/main'
        run: .github/scripts/push-bench-data.sh snapshot corpus.json "corpus/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json.gz" "Corpus search ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: search-effectiveness
          path: |
            search.json
            corpus.json
            corpus.md
