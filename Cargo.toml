[workspace]
resolver = "2"
members = [
    "crates/snappea",
    "crates/snappea-syntax",
    "crates/snappea-lint",
    "crates/snappea-wasm",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crowecawcaw/snappea"
rust-version = "1.87"

[workspace.dependencies]
snappea-syntax = { path = "crates/snappea-syntax", version = "0.2.0" }
snappea-lint = { path = "crates/snappea-lint", version = "0.2.0" }
snappea = { path = "crates/snappea", default-features = false }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
rustc-hash = "2"

[profile.release]
debug = 1

# Size-optimized build for the WebAssembly module:
#   cargo build --profile wasm --target wasm32-unknown-unknown -p snappea-wasm
[profile.wasm]
inherits = "release"
debug = false
strip = true
opt-level = "s"
lto = true
codegen-units = 1
